<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <!-- 設定網頁編碼為 UTF-8，避免中文亂碼 -->
  <meta charset="UTF-8">
  <!-- 設定響應式網頁視口，讓網頁在手機、平板等不同載具上正常顯示 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 設定瀏覽器分頁標題 -->
  <title>p5.js 圖片精靈動畫</title>
  <!-- 載入 p5.js 核心函式庫 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <style>
    /* 移除網頁預設的外距與內距，並隱藏捲軸以達到真正的全螢幕效果 */
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <!-- 載入我們撰寫的 p5.js 動畫程式碼檔案 -->
  <script src="sketch.js"></script>
</body>
</html>
